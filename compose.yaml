services:
  garmin-ai-coach:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: garmin-ai-coach
    restart: unless-stopped
    ports:
      - "${STREAMLIT_SERVER_PORT:-8502}:8502"
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    environment:
      - STREAMLIT_SERVER_PORT=8502
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - TZ=${TIMEZONE:-America/Sao_Paulo}
